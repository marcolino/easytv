name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # The Castlabs dependency uses a public GitHub repository.
      # Rewrite SSH URLs to HTTPS so no SSH key is needed.
      - name: Configure GitHub HTTPS access
        run: |
          git config --global \
            url."https://github.com/".insteadOf \
            "ssh://git@github.com/"
          git config --global --add \
            url."https://github.com/".insteadOf \
            "git@github.com:"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate source
        run: npm run check

      - name: Generate macOS application icon
        run: |
          set -e

          SOURCE="assets/logos/easytv-512.png"
          ICONSET="assets/logos/easytv.iconset"

          test -f "$SOURCE"
          mkdir -p "$ICONSET"

          sips -z 16 16 "$SOURCE" --out "$ICONSET/icon_16x16.png"
          sips -z 32 32 "$SOURCE" --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32 "$SOURCE" --out "$ICONSET/icon_32x32.png"
          sips -z 64 64 "$SOURCE" --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128 "$SOURCE" --out "$ICONSET/icon_128x128.png"
          sips -z 256 256 "$SOURCE" --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256 "$SOURCE" --out "$ICONSET/icon_256x256.png"
          sips -z 512 512 "$SOURCE" --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512 "$SOURCE" --out "$ICONSET/icon_512x512.png"
          sips -z 1024 1024 "$SOURCE" --out "$ICONSET/icon_512x512@2x.png"

          iconutil -c icns "$ICONSET" \
            -o assets/logos/easytv.icns

          rm -rf "$ICONSET"

      - name: Inspect Castlabs Electron distribution
        run: |
          node -p "require('electron/package.json').version"
          ls -lah node_modules/electron/
          ls -lah node_modules/electron/dist/ || true
          find node_modules/electron -maxdepth 3 -name Electron.app -o -name electron

      - name: Build macOS application
        run: npx electron-builder --mac --arm64 --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: easytv-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
