name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            node_arch: arm64
          - arch: x64
            runner: macos-15-intel
            node_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          architecture: ${{ matrix.node_arch }}
          package-manager-cache: false

      - name: Configure GitHub HTTPS access
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            npm ci --no-audit --no-fund
          else
            echo '::warning::No tracked package-lock.json; using npm install'
            npm install --no-audit --no-fund
          fi

      - name: Validate source
        run: npm run check

      - name: Generate macOS application icon
        run: |
          set -e
          SOURCE="assets/logos/easytv-512.png"
          ICONSET="assets/logos/easytv.iconset"
          test -f "$SOURCE"
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$SOURCE" --out "$ICONSET/icon_${size}x${size}.png"
            double=$((size * 2))
            sips -z "$double" "$double" "$SOURCE" --out "$ICONSET/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o assets/logos/easytv.icns
          rm -rf "$ICONSET"

      - name: Inspect Castlabs Electron distribution
        run: |
          node -p "require('electron/package.json').version"
          node -p 'process.arch'
          file node_modules/electron/dist/Electron.app/Contents/MacOS/Electron

      - name: Build macOS application
        run: npx --no-install electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Verify packaged architecture
        run: |
          set -e

          bundle=$(find dist -type d -iname 'easytv.app' -print -quit)

          if [ -z "$bundle" ]; then
            echo "::error::Application bundle not found"
            exit 1
          fi

          executable=$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleExecutable' \
            "$bundle/Contents/Info.plist")

          binary="$bundle/Contents/MacOS/$executable"

          expected_arch="${{ matrix.arch }}"

          if [ "$expected_arch" = "x64" ]; then
            expected_arch="x86_64"
          fi

          echo "Application bundle: $bundle"
          echo "Executable: $binary"
          echo "Expected architecture: $expected_arch"

          file "$binary"
          lipo -info "$binary"

          if ! lipo "$binary" -verify_arch "$expected_arch"; then
            echo "::error::Packaged executable has unexpected architecture"
            exit 1
          fi

          echo "Architecture successfully verified"

      - name: Label installers by architecture
        run: |
          for installer in dist/*.dmg dist/*.zip; do
            test -f "$installer" || continue
            mv "$installer" "${installer%.*}-${{ matrix.arch }}.${installer##*.}"
          done

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: easytv-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
