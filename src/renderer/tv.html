<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https: http:; media-src https: http: blob:; worker-src 'self' blob:">
    <title>EasyTV</title>
    <link rel="stylesheet" href="tv.css">
  </head>
  <body>
    <video id="video" autoplay playsinline></video>
    <canvas id="last-frame" hidden aria-hidden="true"></canvas>
    <div id="loading-spinner" aria-hidden="true"></div>
    <div id="channel-banner" aria-hidden="true">
    </div>
    <aside id="overlay">
      <strong id="name"></strong><span id="quality"></span><span id="status" role="status"></span><button id="web"></button><button id="retry"></button>
    </aside>
    <script src="../../node_modules/hls.js/dist/hls.min.js"></script>
    <script src="tv.js"></script>
  </body>
</html>
