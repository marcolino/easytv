appId: it.easytv.app
productName: EasyTV
executableName: easytv

#electronDist: node_modules/electron/dist

directories:
  output: dist

files:
  - src/**/*
  - assets/**/*

# Linux configuration
linux:
  target:
    - deb
  category: AudioVideo
  icon: assets/logos
  syncDesktopName: true
  maintainer: EasyTV
  synopsis: Desktop TV streaming launcher
  description: Simple desktop application for streaming live TV channels.
  desktop:
    entry:
      Name: EasyTV
      Comment: Desktop TV Streaming
      Categories: AudioVideo;Video;
      StartupWMClass: easytv
      Terminal: false

deb:
  compression: xz

# Windows configuration
win:
  target:
    - nsis
  icon: assets/logos/easytv.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# MacOS configuration
mac:
  target:
    - dmg
    - zip
  icon: assets/logos/easytv.icns
  identity: null
  hardenedRuntime: false